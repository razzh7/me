name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile

      - name: Lint pull request title for squash merges
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      - name: Lint incoming commits
        env:
          FROM_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          if [[ "$FROM_SHA" == 0000000000000000000000000000000000000000 ]]; then
            pnpm exec commitlint --to "$TO_SHA" --verbose
          else
            pnpm exec commitlint --from "$FROM_SHA" --to "$TO_SHA" --verbose
          fi

  build:
    needs: commitlint
    # 运行在ubuntu上
    runs-on: ubuntu-latest

    # 任务流步骤
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g pnpm@10
      - run: pnpm install
      - run: pnpm compress
      - run: pnpm blurhash
      - run: pnpm build

      - name: 部署博客
        if: github.event.action != 'edited'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASS }}
          port: 22
          # 本地打包后的目录
          source: './out/'
          # 服务器存放dist的目录
          target: ${{ secrets.REMOTE_TARGET }}
